{% extends 'base.html' %}
{% block title %}Build my Learning Profile - Hub Academy{% endblock %}
{% block content %}
<section class="lpa-wrap">
    <div class="lpa-progress"><i id="lpa-bar" style="width:0%"></i></div>
    <div class="lpa-card" id="lpa-card"><!-- rendered by JS --></div>
</section>

<script id="lpa-tasks" type="application/json">{{ tasks|tojson }}</script>
<script id="lpa-topics" type="application/json">{{ expertise_areas|map(attribute='name')|list|tojson }}</script>
<script>
(function () {
    const TASKS = JSON.parse(document.getElementById('lpa-tasks').textContent);
    const TOPICS = JSON.parse(document.getElementById('lpa-topics').textContent);
    const card = document.getElementById('lpa-card');
    const bar = document.getElementById('lpa-bar');
    const answers = {};
    let topic = '';
    let idx = -1;          // -1 = topic screen
    let shownAt = 0;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const setBar = pct => { bar.style.width = pct + '%'; };

    function renderTopic() {
        setBar(4);
        const opts = TOPICS.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
        card.innerHTML = `
            <span class="lpa-step">Step 1 of ${TASKS.length + 1}</span>
            <h2>What do you most want to study right now?</h2>
            <p class="lpa-sub">We'll tailor your suggested courses to this. You can change it anytime.</p>
            <label class="lpa-label">Choose a topic
                <select id="lpa-topic-select">
                    <option value="">Select a topic…</option>
                    ${opts}
                    <option value="__other">Something else…</option>
                </select>
            </label>
            <label class="lpa-label" id="lpa-topic-other-wrap" style="display:none">Your topic
                <input type="text" id="lpa-topic-other" placeholder="e.g. AI Strategy, Leadership…">
            </label>
            <div class="lpa-actions">
                <button class="market-btn primary" id="lpa-topic-next">Start assessment <i class="fas fa-arrow-right"></i></button>
            </div>`;
        const sel = document.getElementById('lpa-topic-select');
        const otherWrap = document.getElementById('lpa-topic-other-wrap');
        sel.addEventListener('change', () => { otherWrap.style.display = sel.value === '__other' ? '' : 'none'; });
        document.getElementById('lpa-topic-next').addEventListener('click', () => {
            topic = sel.value === '__other' ? (document.getElementById('lpa-topic-other').value || '').trim() : sel.value;
            if (!topic) { sel.focus(); sel.style.borderColor = '#d64d4d'; return; }
            idx = 0; renderTask();
        });
    }

    function renderTask() {
        const t = TASKS[idx];
        setBar(Math.round((idx + 1) / (TASKS.length + 1) * 100));
        let body;
        if (t.type === 'mcq') {
            body = `<div class="lpa-options">` + t.options.map((o, i) =>
                `<label class="lpa-opt"><input type="radio" name="opt" value="${i}"><span>${esc(o)}</span></label>`).join('') + `</div>`;
        } else {
            body = `<textarea id="lpa-open" class="lpa-open" rows="5" placeholder="Type your answer in 2–3 sentences…"></textarea>`;
        }
        card.innerHTML = `
            <span class="lpa-step">Task ${idx + 1} of ${TASKS.length} · ${esc(t.level)}</span>
            <h2>${esc(t.prompt)}</h2>
            ${body}
            ${t.hint ? `<button type="button" class="lpa-hint-btn" id="lpa-hint-btn"><i class="fas fa-lightbulb"></i> Show a hint</button>
                        <p class="lpa-hint" id="lpa-hint" hidden>${esc(t.hint)}</p>` : ''}
            <div class="lpa-conf">
                <span>How sure are you?</span>
                <div class="lpa-conf-opts">
                    <button type="button" data-c="1">Not sure</button>
                    <button type="button" data-c="2">Fairly sure</button>
                    <button type="button" data-c="3">Very sure</button>
                </div>
            </div>
            <div class="lpa-actions">
                <button class="market-btn primary" id="lpa-next">${idx === TASKS.length - 1 ? 'See my profile' : 'Next'} <i class="fas fa-arrow-right"></i></button>
            </div>
            <p class="lpa-err" id="lpa-err" hidden>Please answer and pick how sure you are.</p>`;

        let hintUsed = false;
        let confidence = null;
        const hintBtn = document.getElementById('lpa-hint-btn');
        if (hintBtn) hintBtn.addEventListener('click', () => {
            document.getElementById('lpa-hint').hidden = false;
            hintBtn.style.display = 'none';
            hintUsed = true;
        });
        card.querySelectorAll('.lpa-conf-opts button').forEach(b => b.addEventListener('click', () => {
            confidence = parseInt(b.dataset.c, 10);
            card.querySelectorAll('.lpa-conf-opts button').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
        }));

        shownAt = Date.now();
        document.getElementById('lpa-next').addEventListener('click', () => {
            let answer;
            if (t.type === 'mcq') {
                const picked = card.querySelector('input[name="opt"]:checked');
                if (!picked) return showErr();
                answer = picked.value;
            } else {
                answer = (document.getElementById('lpa-open').value || '').trim();
                if (!answer) return showErr();
            }
            if (!confidence) return showErr();
            answers[t.id] = { id: t.id, answer: answer, time_ms: Date.now() - shownAt, hint_used: hintUsed, confidence: confidence };
            idx += 1;
            if (idx >= TASKS.length) submit(); else renderTask();
        });
    }

    function showErr() { const e = document.getElementById('lpa-err'); if (e) e.hidden = false; }

    function submit() {
        setBar(100);
        card.innerHTML = `<div class="lpa-loading"><span class="lpa-spinner"></span><h2>Building your learning profile…</h2><p>Analysing your answers and matching a strategy.</p></div>`;
        fetch('/learn/profile/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic: topic, responses: Object.values(answers) })
        }).then(r => r.json()).then(d => {
            window.location.href = (d && d.redirect) ? d.redirect : '/learn/profile';
        }).catch(() => { window.location.href = '/learn/profile'; });
    }

    renderTopic();
})();
</script>

<style>
.lpa-wrap{max-width:720px;margin:0 auto;padding:34px 22px 70px;}
.lpa-progress{height:8px;border-radius:999px;background:#e6ecf5;overflow:hidden;margin-bottom:22px;}
.lpa-progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);border-radius:999px;transition:width .3s ease;}
.lpa-card{background:#fff;border:1px solid #e2e9f2;border-radius:18px;padding:30px 28px;box-shadow:0 12px 34px rgba(15,42,82,.08);}
.lpa-step{display:inline-block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#2563eb;background:#eaf1ff;padding:5px 11px;border-radius:999px;margin-bottom:14px;}
.lpa-card h2{color:#0f2350;font-size:1.32rem;line-height:1.4;margin:0 0 18px;}
.lpa-sub{color:#54617a;margin:-8px 0 18px;font-size:.95rem;}
.lpa-label{display:block;font-size:.82rem;font-weight:600;color:#0f2350;margin-bottom:14px;}
.lpa-label select,.lpa-label input{width:100%;margin-top:6px;padding:12px 13px;border:1px solid #cdd9e8;border-radius:10px;font-size:.98rem;font-family:inherit;color:#0f2350;}
.lpa-options{display:grid;gap:10px;}
.lpa-opt{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border:1px solid #dbe4f0;border-radius:12px;cursor:pointer;transition:all .12s;font-size:.98rem;color:#26364f;}
.lpa-opt:hover{border-color:#2563eb;background:#f7faff;}
.lpa-opt input{margin-top:3px;accent-color:#2563eb;}
.lpa-opt:has(input:checked){border-color:#2563eb;background:#eef4ff;box-shadow:0 0 0 2px rgba(37,99,235,.15);}
.lpa-open{width:100%;padding:13px;border:1px solid #cdd9e8;border-radius:12px;font-family:inherit;font-size:.98rem;resize:vertical;color:#0f2350;}
.lpa-hint-btn{background:none;border:none;color:#2563eb;font-weight:600;font-size:.88rem;cursor:pointer;padding:12px 0 0;}
.lpa-hint{background:#fff8e6;border:1px solid #f3e2b3;color:#7a5c12;padding:11px 14px;border-radius:10px;font-size:.9rem;margin-top:10px;}
.lpa-conf{margin-top:22px;padding-top:18px;border-top:1px solid #eef2f8;}
.lpa-conf>span{display:block;font-size:.82rem;font-weight:600;color:#54617a;margin-bottom:9px;}
.lpa-conf-opts{display:flex;gap:9px;flex-wrap:wrap;}
.lpa-conf-opts button{border:1px solid #cdd9e8;background:#fff;color:#3a4a66;font-size:.86rem;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;transition:all .12s;}
.lpa-conf-opts button:hover{border-color:#2563eb;color:#2563eb;}
.lpa-conf-opts button.sel{background:#2563eb;border-color:#2563eb;color:#fff;}
.lpa-actions{margin-top:24px;display:flex;justify-content:flex-end;}
.lpa-err{color:#d64d4d;font-size:.86rem;font-weight:600;margin:12px 0 0;text-align:right;}
.lpa-loading{text-align:center;padding:24px 0;}
.lpa-loading h2{margin:18px 0 6px;}
.lpa-loading p{color:#54617a;margin:0;}
.lpa-spinner{display:inline-block;width:40px;height:40px;border:4px solid #e6ecf5;border-top-color:#2563eb;border-radius:50%;animation:lpaspin .8s linear infinite;}
@keyframes lpaspin{to{transform:rotate(360deg);}}
</style>
{% endblock %}
