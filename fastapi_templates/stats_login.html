<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics sign in · Hub Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
            font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#0f2350,#16A6AC);}
        .card{background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.35);padding:34px 32px;width:min(360px,92vw);text-align:center;}
        .seal{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.3rem;
            background:radial-gradient(circle at 34% 28%,#5fd3c9,#16A6AC 60%,#0f2350);}
        h1{margin:0 0 4px;font-size:1.3rem;color:#0f2350;}
        p.sub{margin:0 0 20px;color:#667085;font-size:.9rem;}
        .err{background:#fdecec;color:#c0392b;border:1px solid #f3c6cb;border-radius:8px;padding:9px 12px;font-size:.85rem;margin:0 0 14px;}
        input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d8dee9;border-radius:8px;font-size:.95rem;font-family:inherit;margin-bottom:12px;}
        input:focus{outline:none;border-color:#16A6AC;box-shadow:0 0 0 3px rgba(22,166,172,.18);}
        button{width:100%;padding:12px;border:none;border-radius:8px;background:#0f2350;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .15s ease;}
        button:hover{background:#16A6AC;}
    </style>
</head>
<body>
    <div class="card">
        <div class="seal"><i class="fas fa-chart-line"></i></div>
        <h1>Analytics</h1>
        <p class="sub">Enter the access password to view the dashboard.</p>
        {% if failed %}<p class="err">Incorrect password. Please try again.</p>{% endif %}
        <form method="POST" action="/stats/login">
            <input type="password" name="password" placeholder="Access password" required autofocus autocomplete="current-password">
            <button type="submit">View analytics</button>
        </form>
    </div>
</body>
</html>
