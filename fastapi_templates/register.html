{% extends 'base.html' %}
{% block title %}Create Account - Hub Academy{% endblock %}
{% block content %}
<main class="auth-public">
    <section class="market-panel auth-public-card">
        <h1>Create your account</h1>
        <p>Buy courses, subscribe, track progress, and access your learning dashboard.</p>
        <form method="POST" action="/register">
            <input type="hidden" name="next" value="{{ next_page }}">
            <label>Full name<input type="text" name="full_name" required autocomplete="name"></label>
            <label>Email<input type="email" name="email" required autocomplete="email"></label>
            <label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
            <label>Confirm password<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label>
            <button class="market-btn primary" type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="/login?next={{ next_page }}">Login</a></p>
    </section>
</main>
{% endblock %}
