{% extends 'base.html' %}
{% block title %}Admin Login - Hub Academy{% endblock %}
{% block content %}
<main class="auth-public">
    <section class="market-panel auth-public-card">
        <h1>Admin Login</h1>
        <form method="POST" action="/admin/login">
            <label>Username<input type="text" name="username" required></label>
            <label>Password<input type="password" name="password" required></label>
            <button class="market-btn primary" type="submit">Access Admin</button>
        </form>
    </section>
</main>
{% endblock %}
