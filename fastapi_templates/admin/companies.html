{% extends 'admin/base.html' %}
{% block admin_title %}Companies{% endblock %}
{% block admin_content %}
<div class="detail-grid">
<section class="detail-block"><h2>Add Company</h2><form method="POST" action="/admin/companies" class="auth-public-card"><label>Name<input name="name" required></label><label>Member ID<input name="member_id"></label><label>Email<input name="email"></label><button class="market-btn primary">Save</button></form></section>
<section class="detail-block"><h2>Companies</h2>{% for company in companies %}<div class="module-row"><span>{{ loop.index }}</span><div><strong>{{ company.name }}</strong><p>{{ company.email or '' }}</p></div></div>{% endfor %}</section>
</div>
{% endblock %}
