{% extends 'base.html' %}
{% block title %}Forgot Password - Hub Academy{% endblock %}
{% block content %}
<main class="auth-public">
    <section class="market-panel auth-public-card">
        <h1>Reset Password</h1>
        <p>Enter the email address used for your Hub Academy account.</p>
        <form method="POST" action="/forgot-password">
            <label>Email<input type="email" name="email" required autocomplete="email"></label>
            <button class="market-btn primary" type="submit">Send reset link</button>
        </form>
        <p><a href="/login">Back to login</a></p>
    </section>
</main>
{% endblock %}
