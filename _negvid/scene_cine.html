<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#05060a;font-family:'Poppins','Segoe UI',system-ui,Arial,sans-serif;}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;}
  .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;will-change:transform;filter:saturate(1.08) contrast(1.05);}
  .kb1 .bg{animation:kb1 14s linear both;} .kb2 .bg{animation:kb2 14s linear both;} .kb3 .bg{animation:kb3 14s linear both;} .kb4 .bg{animation:kb4 14s linear both;}
  @keyframes kb1{from{transform:scale(1.05);}to{transform:scale(1.20);}}
  @keyframes kb2{from{transform:scale(1.20) translateX(0);}to{transform:scale(1.12) translateX(48px);}}
  @keyframes kb3{from{transform:scale(1.08) translateY(0);}to{transform:scale(1.20) translateY(-44px);}}
  @keyframes kb4{from{transform:scale(1.20);}to{transform:scale(1.06);}}
  /* colour grade + darkening for legibility */
  .grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,30,.55),rgba(8,14,30,.35) 42%,rgba(8,14,30,.82));mix-blend-mode:multiply;}
  .tint{position:absolute;inset:0;background:radial-gradient(120% 100% at 30% 20%,rgba(36,128,220,.20),transparent 55%),radial-gradient(120% 100% at 80% 90%,rgba(124,58,237,.22),transparent 55%);mix-blend-mode:screen;}
  .vig{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 45%,transparent 30%,rgba(4,6,12,.78) 100%);}
  /* film grain */
  .grain{position:absolute;inset:-60%;opacity:.055;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain .5s steps(3) infinite;}
  @keyframes grain{0%{transform:translate(0,0);}33%{transform:translate(-24px,14px);}66%{transform:translate(18px,-20px);}100%{transform:translate(0,0);}}
  /* light sweep + entry flash */
  .sweep{position:absolute;top:-10%;left:-45%;width:38%;height:120%;transform:skewX(-16deg);
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);animation:sweep 1.7s cubic-bezier(.4,0,.2,1) .45s both;mix-blend-mode:screen;}
  @keyframes sweep{from{left:-45%;}to{left:135%;}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .55s ease-out both;}
  @keyframes flash{0%{opacity:0;}10%{opacity:.5;}100%{opacity:0;}}
  .logo{position:absolute;top:52px;right:64px;height:96px;opacity:.97;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 150px;}
  .eyebrow{color:#4fe3d7;font-size:32px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;animation:up .8s ease .2s both;}
  .accent{width:0;height:6px;border-radius:4px;background:linear-gradient(90deg,#2480DC,#16A6AC);margin:28px 0 30px;animation:grow .8s cubic-bezier(.4,0,.2,1) .55s both;}
  @keyframes grow{from{width:0;}to{width:140px;}}
  h1{color:#fff;font-size:120px;line-height:1.02;font-weight:700;letter-spacing:-1px;text-shadow:0 10px 50px rgba(0,0,0,.85);opacity:0;
     animation:titlein 1.05s cubic-bezier(.2,.75,.2,1) .4s both;}
  @keyframes titlein{from{opacity:0;transform:translateY(38px) scale(1.07);filter:blur(14px);letter-spacing:.16em;}
    to{opacity:1;transform:none;filter:blur(0);letter-spacing:-1px;}}
  .sub{color:#eaf1fc;font-size:42px;font-weight:400;margin-top:30px;max-width:1300px;text-shadow:0 3px 22px rgba(0,0,0,.82);opacity:0;animation:up .95s ease .85s both;}
  @keyframes up{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
  .points{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:40px;}
  .chip{color:#f2f7ff;font-size:30px;font-weight:500;padding:14px 30px;border:1px solid rgba(120,200,240,.35);border-radius:999px;background:rgba(20,60,110,.28);box-shadow:0 6px 22px rgba(0,0,0,.35);text-shadow:0 2px 12px rgba(0,0,0,.55);opacity:0;animation:chipin .7s cubic-bezier(.2,.75,.2,1) both;}
  @keyframes chipin{from{opacity:0;transform:translateY(26px) scale(.94);}to{opacity:1;transform:none;}}
</style></head><body>
  <div class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="grade"></div><div class="tint"></div>
    <div class="grain"></div>
    <div class="sweep"></div>
    <div class="vig"></div>
    <img class="logo" src="logo.png">
    <div class="content"><span class="eyebrow" id="eyebrow"></span><div class="accent"></div><h1 id="title"></h1><div class="sub" id="sub"></div><div class="points" id="points"></div></div>
    <div class="flash"></div>
  </div>
<script>
  var q=new URLSearchParams(location.search);
  document.getElementById('bg').style.backgroundImage="url('"+(q.get('bg')||'v1bg.jpg')+"')";
  document.getElementById('stage').className='stage kb'+(q.get('kb')||'1');
  document.getElementById('eyebrow').textContent=q.get('eyebrow')||'';
  document.getElementById('title').innerHTML=(q.get('title')||'').replace(/\n/g,'<br>');
  var s=q.get('sub')||''; if(s){document.getElementById('sub').textContent=s;}else{document.getElementById('sub').style.display='none';}
  var pts=(q.get('points')||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
  var pc=document.getElementById('points');
  pts.forEach(function(t,i){ var d=document.createElement('span'); d.className='chip'; d.textContent=t; d.style.animationDelay=(1.15+i*0.18)+'s'; pc.appendChild(d); });
</script></body></html>
